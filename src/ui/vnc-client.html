<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login remoto DeepSeek (VNC)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #16181d; color: #e6e8ec; height: 100vh; display: flex; flex-direction: column;
    }
    #toolbar {
      display: flex; align-items: center; gap: 12px; padding: 8px 12px;
      background: #1f232b; border-bottom: 1px solid #2c313b; flex: 0 0 auto;
    }
    #status { color: #9aa3b2; font-size: 13px; }
    button {
      background: #2b6cb0; color: #fff; border: 0; border-radius: 6px;
      padding: 6px 14px; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #357fd6; }
    #screen { flex: 1 1 auto; min-height: 0; background: #000; }
    #screen > div { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btnReconnect">Reconectar</button>
    <span id="status">Conectando ao VNC...</span>
  </div>
  <div id="screen"></div>
  <script type="module">
    import RFB from './core/rfb.js';

    const screen = document.getElementById('screen');
    const statusEl = document.getElementById('status');
    let rfb = null;

    function wsUrl() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const token = new URLSearchParams(location.search).get('token');
      return `${proto}://${location.host}/vnc/ws${token ? '?token=' + encodeURIComponent(token) : ''}`;
    }

    function connect() {
      if (rfb) { try { rfb.disconnect(); } catch {} rfb = null; }
      statusEl.textContent = 'Conectando ao VNC...';
      rfb = new RFB(screen, wsUrl(), { credentials: { password: '' } });
      rfb.scaleViewport = true;
      rfb.resizeSession = true;
      rfb.addEventListener('connect', () => {
        statusEl.textContent = 'Conectado. Faça o login no navegador DeepSeek e depois clique em "Concluir login" no dashboard.';
      });
      rfb.addEventListener('disconnect', (e) => {
        statusEl.textContent = 'Desconectado' + (e.detail && e.detail.clean ? '' : ' (erro)') + '. Clique em Reconectar.';
        rfb = null;
      });
      rfb.addEventListener('securityfailure', (e) => {
        statusEl.textContent = 'Falha de segurança: ' + (e.detail && e.detail.reason ? e.detail.reason : 'sem senha/permissão');
        rfb = null;
      });
    }

    document.getElementById('btnReconnect').addEventListener('click', connect);
    connect();
  </script>
</body>
</html>
